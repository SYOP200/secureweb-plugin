<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureWeb Basic Integration</title>
    <!-- Add SecureWeb with single line of code -->
    <script src="https://cdn.yourdomain.com/secureweb.js" data-api-key="your-api-key"></script>
</head>
<body>
    <h1>SecureWeb Basic Integration Example</h1>
    
    <p>This page is protected by SecureWeb with zero configuration needed.</p>
    
    <form id="contact-form">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
    
    <div id="response"></div>
    
    <script>
        // Regular form handling - SecureWeb handles security automatically
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const response = await fetch('/api/contact', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            document.getElementById('response').textContent = result.message;
        });
    </script>
</body>
</html>
