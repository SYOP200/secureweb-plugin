<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureWeb - API Security</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 480px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #007aff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
        }

        .links a {
            color: #007aff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .token-display {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 12px;
            border: 1px solid #e1e1e1;
        }

        .copy-btn {
            background: #6c757d;
            margin-top: 8px;
            padding: 8px;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SecureWeb</h1>
        <p class="subtitle">Protect your websites with one line of code</p>

        <div id="signup-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 8 characters" required>
            </div>

            <button onclick="signup()" id="signup-btn">Sign Up</button>

            <div class="message" id="message"></div>

            <div class="links">
                Already have an account? <a href="#" onclick="showLogin()">Log in</a>
            </div>
        </div>

        <div id="login-form" style="display: none;">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Your password" required>
            </div>

            <button onclick="login()" id="login-btn">Log In</button>

            <div class="message" id="login-message"></div>

            <div class="links">
                New user? <a href="#" onclick="showSignup()">Sign up</a>
            </div>
        </div>

        <div id="dashboard" style="display: none;">
            <h1>Your API Token</h1>
            <p class="subtitle">Use this token in your SecureWeb integration</p>

            <div class="token-display" id="api-token"></div>
            <button class="copy-btn" onclick="copyToken()">Copy Token</button>

            <div class="message" id="dashboard-message"></div>

            <div class="links">
                <a href="#" onclick="logout()">Log out</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://secureweb-backend-production.up.railway.app';
        let currentUser = null;

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
        }

        function hideMessage(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }

        function showSignup() {
            document.getElementById('signup-form').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
        }

        function showLogin() {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signup-btn');

            if (!email || !password) {
                showMessage('message', 'Please fill in all fields', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('message', 'Password must be at least 8 characters', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Creating account...';

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('api-token').textContent = data.apiToken;
                    showDashboard();
                    showMessage('dashboard-message', 'Account created! Your API token is ready.', 'success');
                } else {
                    showMessage('message', data.error || 'Signup failed', 'error');
                }
            } catch (error) {
                showMessage('message', 'Network error. Please try again.', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Sign Up';
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                showMessage('login-message', 'Please fill in all fields', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Logging in...';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    // Get user's tokens
                    const tokensResponse = await fetch(`${API_BASE}/api/auth/tokens/${currentUser.id}`);
                    const tokensData = await tokensResponse.json();
                    
                    if (tokensData.success && tokensData.tokens.length > 0) {
                        document.getElementById('api-token').textContent = tokensData.tokens[0].fullToken;
                    } else {
                        // Generate new token
                        const tokenResponse = await fetch(`${API_BASE}/api/auth/token`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: currentUser.id, name: 'Default Token' })
                        });
                        const tokenData = await tokenResponse.json();
                        document.getElementById('api-token').textContent = tokenData.token;
                    }
                    
                    showDashboard();
                    showMessage('dashboard-message', 'Welcome back!', 'success');
                } else {
                    showMessage('login-message', data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('login-message', 'Network error. Please try again.', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Log In';
        }

        function copyToken() {
            const token = document.getElementById('api-token').textContent;
            navigator.clipboard.writeText(token);
            showMessage('dashboard-message', 'Token copied to clipboard!', 'success');
        }

        function logout() {
            currentUser = null;
            showSignup();
            hideMessage('dashboard-message');
        }
    </script>
</body>
</html>
